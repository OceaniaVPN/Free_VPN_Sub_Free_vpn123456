name: Sync subscription and shared season

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-subscription-and-season
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and validate upstream subscription
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="https://raw.githubusercontent.com/OceaniaVPN/StekloVPN/refs/heads/main/configs/okeania_auto.txt"
          mkdir -p configs
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 90 "$SOURCE_URL" -o "$RUNNER_TEMP/okeania_auto.txt"
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib
          data = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "okeania_auto.txt").read_bytes()
          parsed = json.loads(data)
          if not isinstance(parsed, list) or not parsed:
              raise SystemExit("Source config must be a non-empty JSON array")
          target = pathlib.Path("configs/okeania_auto.txt")
          current = target.read_bytes() if target.exists() else None
          if current == data:
              print("Subscription is unchanged.")
          else:
              target.write_bytes(data)
              meta = {
                  "source": "https://raw.githubusercontent.com/OceaniaVPN/StekloVPN/refs/heads/main/configs/okeania_auto.txt",
                  "updatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "sizeBytes": len(data),
                  "profiles": len(parsed),
                  "sha256": hashlib.sha256(data).hexdigest()
              }
              pathlib.Path("subscription-meta.json").write_text(json.dumps(meta, ensure_ascii=False, indent=2) + "\n")
              print("Validated and updated", len(parsed), "profiles.")
          PY

      - name: Read the shared season from Proxy_sait
        shell: bash
        run: |
          set -euo pipefail
          SEASON_URL="https://raw.githubusercontent.com/OceaniaVPN/Proxy_sait/pages-migration/public/season.json"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 45 "$SEASON_URL" -o "$RUNNER_TEMP/season-response.json"
          python3 - <<'PY'
          import json, os, pathlib
          response = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "season-response.json").read_text())
          allowed = {"spring", "summer", "autumn", "winter"}
          season = response.get("season") if isinstance(response, dict) else None
          if season not in allowed:
              raise SystemExit("Proxy_sait returned an invalid season: " + repr(season))
          result = {
              "season": season,
              "updatedAt": response.get("updatedAt"),
              "source": "https://raw.githubusercontent.com/OceaniaVPN/Proxy_sait/pages-migration/public/season.json"
          }
          target = pathlib.Path("season.json")
          current = json.loads(target.read_text()) if target.exists() else None
          if current != result:
              target.write_text(json.dumps(result, ensure_ascii=False, indent=2) + "\n")
              print("Updated shared season from Proxy_sait:", season)
          else:
              print("Shared season is unchanged:", season)
          PY

      - name: Commit changed feed, metadata and season
        shell: bash
        run: |
          set -euo pipefail
          git add configs/okeania_auto.txt subscription-meta.json season.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Sync STEKLOVPN subscription and season"
            git push
          fi
